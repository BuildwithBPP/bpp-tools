# Refreshes the HubSpot half of data/scoreboard.json for the Performance Dashboard
# (pages/performance-dashboard.html -> Q4 Scoreboard, Sales, AI & Tech tabs).
# Runs Sunday + Wednesday ~6am ET (10:00 UTC; 5am during EST) and on demand from the Actions tab.
# Needs repo secret HUBSPOT_TOKEN: a HubSpot private app token with read scopes
# crm.objects.deals.read, crm.objects.owners.read, crm.objects.contacts.read, crm.schemas.deals.read.
name: Scoreboard refresh

on:
  schedule:
    - cron: "0 10 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scoreboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull HubSpot into data/scoreboard.json
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/scoreboard/refresh_scoreboard.py

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- data/scoreboard.json; then
            echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "bpp-scoreboard-bot"
          git config user.email "bpp-scoreboard-bot@users.noreply.github.com"
          git add data/scoreboard.json
          git commit -m "scoreboard: HubSpot refresh $(TZ=America/New_York date +%F)"
          # GitHub occasionally answers a push with a 500; retry before giving up.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$i" = 3 ]; then echo "Push failed 3 times"; exit 1; fi
            sleep $((i * 15))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not always start the Pages build, so request one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages build request failed; the next push will publish it."
