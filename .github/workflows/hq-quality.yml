name: BPP HQ quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hq/**"
      - "data/registry/**"
      - ".github/workflows/hq-quality.yml"
  push:
    branches:
      - main
    paths:
      - "hq/**"
      - "data/registry/**"
      - ".github/workflows/hq-quality.yml"

permissions:
  contents: read

concurrency:
  group: hq-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hq

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hq/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test HQ
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Package staging Worker without deploying
        run: npx wrangler deploy --config refresh-worker/wrangler.staging.toml --dry-run
