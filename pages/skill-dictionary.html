<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPP Skill Dictionary</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<style>
:root{--navy:#044771;--gold:#f1be5c;--bg:#f4f6f8;--card:#fff;--border:#d7e0e8;--text:#1a2b3c;--muted:#526579;--green:#137a43;--amber:#8a5800;--red:#a12a23;--sans:Inter,sans-serif;--head:Montserrat,sans-serif}body{background:var(--bg);color:var(--text);font-family:var(--sans);margin:0}.header{background:var(--navy);color:#fff;padding:28px 40px}.header h1{font:800 28px var(--head);margin:0}.header h1 span{color:var(--gold)}.header p{color:#dce8f0;font-size:13px;margin:6px 0 0}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.meta span{background:#ffffff1a;border-radius:4px;color:#fff;font-size:11px;font-weight:600;padding:4px 10px}.container{max-width:1100px;margin:auto;padding:28px 24px 60px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.search{border:2px solid var(--border);border-radius:8px;color:var(--text);font:14px var(--sans);min-width:250px;padding:11px 14px;flex:1}.search:focus,.filter:focus-visible{outline:3px solid #f1be5c;outline-offset:2px}.filter{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--navy);cursor:pointer;font:700 10px var(--head);letter-spacing:.06em;padding:7px 11px;text-transform:uppercase}.filter[aria-pressed="true"]{background:var(--navy);color:#fff}.group{margin:30px 0}.group h2{border-bottom:2px solid var(--gold);color:var(--navy);font:800 16px var(--head);margin:0 0 14px;padding-bottom:8px}.count{color:var(--muted);font:600 11px var(--sans);margin-left:8px}.grid{display:grid;gap:8px}.skill{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px}.skill h3{color:var(--navy);font:700 14px var(--head);margin:0 0 6px}.skill p{color:var(--text);font-size:12px;line-height:1.55;margin:0}.tag{color:var(--muted);display:block;font-size:10px;font-weight:600;letter-spacing:.05em;margin-top:9px;text-transform:uppercase}.state{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:8px;color:var(--text);line-height:1.55;padding:18px 20px}.state.error{border-left-color:var(--red)}.source{color:var(--muted);font-size:11px;line-height:1.5;margin:22px 0}.hub-footer{margin-top:0}@media(max-width:700px){.header{padding:22px 18px}.container{padding:20px 14px}.controls{display:block}.search{box-sizing:border-box;margin-bottom:10px;width:100%}}@media print{.hub-nav,.controls{display:none}.header{background:#fff;color:#000;padding:0}.header h1,.header h1 span{color:#000}.header p,.meta{color:#000}.skill{break-inside:avoid}}
</style>
</head>
<body>
<div id="hub-nav"></div>
<header class="header"><h1>BPP Skill <span>Dictionary</span></h1><p>Current AI workflow capabilities, generated from safe skill metadata.</p><div class="meta" id="inventory-meta"><span>Loading inventory</span></div></header>
<main class="container">
  <div class="controls" aria-label="Skill Directory controls"><input id="search" class="search" type="search" placeholder="Search skills" aria-label="Search skills"><div id="filters"></div></div>
  <div id="inventory-state" class="state" role="status">Loading generated Skill Directory data.</div>
  <section id="skills-container" aria-live="polite"></section>
  <p class="source" id="inventory-source">Source: generated SKILL.md metadata. Instruction bodies and local paths are intentionally excluded.</p>
</main>
<div class="hub-footer"><div class="footer-brand">Business Plans <span>Plus</span></div><div class="footer-note">Internal Tools Hub</div></div>
<script src="../js/nav.js" data-page="library"></script>
<script>
(function(){
  var records=[],active='all',search=document.getElementById('search'),state=document.getElementById('inventory-state'),container=document.getElementById('skills-container'),filters=document.getElementById('filters'),meta=document.getElementById('inventory-meta');
  var labels={'bpp-built':'BPP Built','bpp-customized':'BPP Customized','third-party':'Third Party','system-provided':'System Provided'};
  function escaped(value){var el=document.createElement('span');el.textContent=value;return el.innerHTML}
  function render(){var query=search.value.toLowerCase().trim();var visible=records.filter(function(item){return(active==='all'||item.classification===active)&&[item.title,item.id,item.description].join(' ').toLowerCase().indexOf(query)>-1});container.innerHTML='';if(!visible.length){container.innerHTML='<p class="state">No skills match this view.</p>';return}Object.keys(labels).forEach(function(group){var items=visible.filter(function(item){return item.classification===group});if(!items.length)return;var section=document.createElement('section');section.className='group';section.innerHTML='<h2>'+labels[group]+'<span class="count">'+items.length+'</span></h2><div class="grid">'+items.map(function(item){return'<article class="skill"><h3>'+escaped(item.title)+'</h3><p>'+escaped(item.description)+'</p><span class="tag">'+escaped(item.availability||'available')+' · '+escaped(item.source||'metadata')+'</span></article>'}).join('')+'</div>';container.appendChild(section)})}
  function renderFilters(){Object.keys(labels).concat('all').forEach(function(key){var button=document.createElement('button');button.className='filter';button.type='button';button.textContent=key==='all'?'All':labels[key];button.setAttribute('aria-pressed',key===active?'true':'false');button.addEventListener('click',function(){active=key;renderFilters();render()});filters.appendChild(button)})}
  function formatDate(value){var date=new Date(value);return isNaN(date)?'unknown':date.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}
  fetch('../data/generated/skills.json').then(function(response){if(!response.ok)throw new Error('Inventory file is unavailable.');return response.json()}).then(function(data){records=Array.isArray(data.skills)?data.skills:[];var age=Date.now()-Date.parse(data.generated_at);var stale=isNaN(age)||age>(data.freshness_days||7)*86400000;meta.innerHTML='<span>'+records.length+' skills</span><span>Generated '+escaped(formatDate(data.generated_at))+'</span><span>'+ (stale?'Stale: refresh needed':'Current generated snapshot') +'</span>';state.remove();document.getElementById('inventory-source').textContent='Source: '+(data.source||'generated skill metadata')+'. Generated '+formatDate(data.generated_at)+'. Instruction bodies and local paths are intentionally excluded.';renderFilters();render()}).catch(function(error){state.className='state error';state.textContent='Skill Directory data is unavailable. Run python scripts/refresh_hub.py locally, then publish the generated snapshot. '+error.message;meta.innerHTML='<span>Unavailable</span>'})
  search.addEventListener('input',render)
})();
</script>
</body>
</html>
