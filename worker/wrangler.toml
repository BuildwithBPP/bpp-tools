name = "bpp-recap-worker"
main = "src/index.js"
compatibility_date = "2026-05-10"

# Save-only Worker. Email send happens from Claude Code via ms365 MCP
# (matches personal morning-brief pattern). Keep this file boring.

[vars]
ALLOWED_ORIGIN = "https://buildwithbpp.github.io"
GITHUB_REPO = "BuildwithBPP/bpp-tools"

# Secrets (set via `wrangler secret put` — DO NOT commit values):
#   GITHUB_TOKEN    - fine-grained PAT with Contents: read+write on bpp-tools
#   SHARED_SECRET   - bearer token the browser sends; rotate quarterly
